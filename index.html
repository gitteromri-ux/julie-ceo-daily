<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julie Masterclass · Campaign update</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(13% 0.02 260);--ink:oklch(97% 0.01 90);--ink2:oklch(80% 0.02 90);--ink3:oklch(64% 0.02 90);
  --gold:oklch(87% 0.10 215);--gold2:oklch(70% 0.14 230);--blue:oklch(80% 0.12 230);--red:oklch(70% 0.19 25);--green:oklch(80% 0.16 150);
  --line:oklch(100% 0 0 / .11);
  --fs-xxl:clamp(64px,8.5vw,160px);--fs-xl:clamp(44px,5vw,92px);--fs-l:clamp(36px,3.6vw,66px);--fs-m:clamp(23px,1.8vw,33px);--fs-s:clamp(20px,1.4vw,26px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(1200px 800px at 85% -10%, oklch(45% 0.12 230 / .35), transparent 60%),
  radial-gradient(900px 700px at -10% 110%, oklch(45% 0.10 240 / .30), transparent 60%),var(--bg);
  font-feature-settings:"tnum" 1;line-height:1.25}
section.slide{min-height:100svh;scroll-snap-align:start;padding:clamp(28px,4vw,64px) clamp(22px,5.5vw,100px) clamp(60px,6vw,90px);display:flex;flex-direction:column;justify-content:center;position:relative;border-top:1px solid var(--line)}
.kicker{font-size:clamp(20px,1.5vw,27px);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:16px;display:flex;gap:16px;align-items:center}
.kicker .no{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--gold);color:oklch(20% 0.05 240);font-weight:800;letter-spacing:0}
h1,h2{font-family:"Instrument Serif",Georgia,serif;font-weight:500;letter-spacing:-.02em;line-height:1.02}
h1{font-size:var(--fs-xl)}
h2{font-size:var(--fs-l);margin-bottom:clamp(18px,2.2vw,34px);max-width:28ch}
h2 b,h1 b{color:var(--gold);font-weight:500}
p,li{font-size:var(--fs-m);color:var(--ink2);line-height:1.35}
.num{font-family:"Instrument Serif",serif;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:.95}
.grid{display:grid;gap:clamp(12px,1.4vw,24px)}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.card{background:linear-gradient(160deg,oklch(100% 0 0 / .07),oklch(100% 0 0 / .02));border:1px solid var(--line);border-radius:24px;padding:clamp(18px,2vw,32px);backdrop-filter:blur(10px);box-shadow:0 30px 60px -30px oklch(0% 0 0 / .8), inset 0 1px 0 oklch(100% 0 0 / .08)}
.card .lab{font-size:var(--fs-s);color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:10px}
.card .big{font-size:var(--fs-xl);color:var(--ink)}
.card .sub{font-size:var(--fs-s);color:var(--ink2);margin-top:10px;line-height:1.3}
.gold{color:var(--gold)}.blue{color:var(--blue)}.red{color:var(--red)}.green{color:var(--green)}.dim{color:var(--ink3)}
.tbl{width:100%}
table{width:100%;border-collapse:collapse;font-size:var(--fs-m)}
th{font-size:var(--fs-s);text-align:left;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:clamp(10px,1vw,18px) 14px;border-bottom:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums;vertical-align:top}
td.n,th.n{text-align:right}
td small{display:block;font-size:var(--fs-s);color:var(--ink3);margin-top:4px;line-height:1.3}
tr.total td{font-weight:700;border-top:2px solid oklch(100% 0 0 / .25);border-bottom:none}
.dense td{padding:clamp(8px,.8vw,13px) 14px}.dense{font-size:clamp(18px,1.4vw,25px)}
.pill{display:inline-block;padding:5px 13px;border-radius:999px;font-size:var(--fs-s);font-weight:700;letter-spacing:.03em;white-space:nowrap}
.p-red{background:oklch(68% 0.19 25 / .18);color:var(--red)}.p-green{background:oklch(78% 0.16 150 / .16);color:var(--green)}.p-gold{background:oklch(87% 0.10 215 / .16);color:var(--gold)}.p-blue{background:oklch(78% 0.12 230 / .16);color:var(--blue)}.p-dim{background:oklch(100% 0 0 / .08);color:var(--ink2)}
.foot{position:absolute;left:clamp(22px,5.5vw,100px);right:clamp(22px,5.5vw,100px);bottom:18px;display:flex;justify-content:space-between;font-size:17px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
ul.big{list-style:none;display:grid;gap:clamp(12px,1.3vw,20px)}
ul.big li{padding-left:44px;position:relative;font-size:var(--fs-m);color:var(--ink)}
ul.big li::before{content:"";position:absolute;left:0;top:.42em;width:18px;height:18px;border-radius:5px;background:var(--gold);transform:rotate(45deg)}
ul.big li b{color:var(--gold);font-weight:700}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.cover{background:radial-gradient(900px 600px at 70% 40%, oklch(60% 0.14 230 / .25), transparent 60%)}
.cover h1{font-size:clamp(40px,5.2vw,92px);max-width:16ch}
.cover .meta{display:flex;gap:clamp(24px,4vw,64px);flex-wrap:wrap;margin-top:clamp(28px,3.5vw,56px)}
.cover .meta div{font-size:var(--fs-m)}
.cover .meta span{display:block;font-size:var(--fs-s);color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:6px}
.note{font-size:var(--fs-s);color:var(--ink2);margin-top:16px;line-height:1.4;max-width:120ch}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,3.5vw,60px);align-items:start}
/* phase cards */
.phase{position:relative;overflow:hidden}
.phase::after{content:"";position:absolute;inset:auto -20% -40% auto;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,oklch(70% 0.14 230 / .22),transparent)}
.phase.sell::after{background:radial-gradient(closest-side,oklch(78% 0.16 150 / .22),transparent)}
/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:Inter,sans-serif;fill:var(--ink2)}
/* adset cards */
.set{display:flex;flex-direction:column;gap:10px;padding:clamp(14px,1.4vw,22px)}
.set .id{font-family:"Instrument Serif",serif;font-size:var(--fs-l);line-height:1;display:flex;justify-content:space-between;align-items:baseline}
.set .id small{font-family:Inter;font-size:14px;color:var(--ink3);letter-spacing:.08em}
.set .nm{font-size:var(--fs-s);font-weight:700;color:var(--gold)}
.set .aud{font-size:clamp(14px,1.05vw,19px);color:var(--ink2);line-height:1.35;min-height:4.1em}
.set .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:clamp(14px,1vw,18px);color:var(--ink3)}
.set .kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ads{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.ads figure{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:oklch(20% .02 260);position:relative}
.ads img{width:100%;height:100%;object-fit:cover;display:block}
.ads figcaption{position:absolute;left:0;right:0;bottom:0;font-size:clamp(11px,.8vw,14px);line-height:1.15;padding:6px 7px;background:linear-gradient(transparent,oklch(0% 0 0 / .85));color:#fff;font-weight:600}
.ads figure.new::before{content:"NEW";position:absolute;top:7px;left:7px;font-size:11px;font-weight:800;letter-spacing:.08em;background:var(--green);color:#042;padding:2px 5px;border-radius:4px;z-index:1}
.set .res{font-size:clamp(14px,1.05vw,19px);color:var(--ink);border-top:1px solid var(--line);padding-top:8px}
.set .res b{color:var(--green)}
/* groups wall */
.wall{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline}
.wall span{font-family:"Instrument Serif",serif;line-height:1;color:var(--ink2);white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:oklch(100% 0 0 / .03)}
.wall span i{font-style:normal;color:var(--ink3);font-family:Inter;font-size:.55em;margin-left:6px;letter-spacing:.04em}
.wall span.live{color:var(--green);border-color:oklch(78% 0.16 150 / .4);background:oklch(78% 0.16 150 / .08)}
/* timeline table rows */
.tlx td:first-child{white-space:nowrap;font-weight:700;color:var(--gold)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.4vw,24px);align-items:stretch}
.step .lab{color:var(--ink3)}
.step .big{font-size:clamp(48px,5.6vw,104px)}
.arrow{font-size:var(--fs-l);color:var(--ink3);align-self:center;text-align:center}
.card table{font-size:clamp(18px,1.25vw,23px)}.card td{padding:clamp(6px,.55vw,9px) 10px;white-space:nowrap}.card th{padding:6px 10px;font-size:clamp(14px,1vw,17px);white-space:nowrap}.card td small{white-space:normal;font-size:clamp(14px,1vw,17px)}
.xdense{font-size:clamp(19px,1.35vw,24px)}.xdense td{padding:clamp(7px,.65vw,11px) 12px}.xdense td small{font-size:clamp(13px,.95vw,17px)}
#s3 .card .sub,#s5 .note,#s3 .note{font-size:clamp(16px,1.15vw,21px)}#s3 h2,#s5 h2{margin-bottom:14px}#s3 .card .big{font-size:clamp(40px,4.2vw,78px)}#s4 .split{grid-template-columns:1.45fr .55fr;align-items:center}#cps{max-height:46vh;margin:0 auto}#s4 h2{margin-bottom:8px}#s4 .step{padding:clamp(12px,1.1vw,18px) clamp(14px,1.4vw,22px)}#s4 .step .big{font-size:clamp(36px,3.3vw,60px)}#s4 .step .sub{margin-top:4px;font-size:clamp(14px,1.05vw,19px)}#s4 .step .lab{margin-bottom:4px;font-size:clamp(13px,1vw,18px)}
#s6 .card .sub{font-size:clamp(17px,1.2vw,22px)}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){
  .card .tbl table{min-width:0}.card td,.card th{white-space:normal;padding:6px}.card .tbl{margin:0;padding:0;overflow-x:auto}.card{min-width:0;overflow:hidden}.wall span{white-space:normal}#s4 .split{grid-template-columns:1fr}
  .g2,.g3,.g4,.split,.steps{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}
  .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -8px;padding:0 8px}.tbl table{min-width:720px}
  .foot{position:static;margin-top:28px;flex-wrap:wrap;gap:8px}
  section.slide{padding-bottom:clamp(28px,4vw,64px)}
  .set .aud{min-height:0}
}

/* neon timeline */
.neon{background:radial-gradient(1000px 600px at 50% 110%, oklch(55% 0.14 225 / .28), transparent 60%),radial-gradient(800px 500px at 10% -10%, oklch(60% 0.12 230 / .18), transparent 60%)}
.neon .kicker{color:var(--cy)}
.neon h2 b{color:var(--cy)}
:root{--cy:oklch(86% 0.11 220);--cy2:oklch(70% 0.14 230)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,1.6vw,28px);align-items:stretch}
.pillar{position:relative;border-radius:26px;padding:clamp(18px,1.9vw,30px);background:linear-gradient(180deg,oklch(30% 0.07 235 / .55),oklch(16% 0.03 250 / .7));border:1px solid oklch(80% 0.12 220 / .35);box-shadow:0 0 0 1px oklch(80% 0.12 220 / .08) inset,0 0 60px -10px oklch(75% 0.14 225 / .45),0 30px 60px -30px #000;display:flex;flex-direction:column;gap:12px}
.pillar::before{content:"";position:absolute;left:10%;right:10%;top:-1px;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 24px var(--cy)}
.pillar .day{font-family:"Instrument Serif",serif;font-size:clamp(30px,2.6vw,46px);color:#fff;line-height:1}
.pillar .day small{display:block;font-family:Inter;font-size:clamp(16px,1.1vw,20px);color:var(--cy);letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:8px}
.pillar .what{font-size:clamp(20px,1.5vw,27px);color:#fff;line-height:1.3;font-weight:600}
.pillar .why{font-size:clamp(18px,1.3vw,23px);color:oklch(85% 0.03 230);line-height:1.35}
.pillar .why b{color:var(--cy);font-weight:700}
.pillar .res{margin-top:auto;border-top:1px solid oklch(80% 0.12 220 / .25);padding-top:12px;font-size:clamp(18px,1.3vw,23px);color:#fff}
.pillar .res b{color:var(--green)}
.pillar .res i{color:var(--red);font-style:normal}
/* big ad set cards */
.bigsets{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.6vw,28px)}
.bigset{display:grid;grid-template-columns:1fr;gap:10px;padding:clamp(16px,1.5vw,24px)}
.bigset .top{display:flex;justify-content:space-between;align-items:baseline}
.bigset .top .id{font-family:"Instrument Serif",serif;font-size:clamp(40px,3.4vw,60px);line-height:1}
.bigset .top .intent{font-size:clamp(15px,1.05vw,19px);font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.bigset .nm{font-size:clamp(20px,1.5vw,28px);font-weight:700;color:var(--gold);line-height:1.15}
.bigset dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:clamp(17px,1.12vw,21px);margin:0;line-height:1.3}
.bigset dt{color:var(--ink3)}.bigset dd{color:var(--ink);font-weight:600;margin:0;font-variant-numeric:tabular-nums}
.bigset .ads{grid-template-columns:repeat(4,1fr);gap:10px}
.bigset .ads figcaption{font-size:clamp(15px,1.05vw,18px)}
.bigset .verdict{border-top:1px solid var(--line);padding-top:8px;font-size:clamp(18px,1.2vw,22px);color:var(--ink)}
.bigset .verdict b{color:var(--green)}
/* organic posts */
.posts{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.4vw,22px)}
.post{border-radius:20px;overflow:hidden;background:oklch(100% 0 0 / .05);border:1px solid var(--line);display:flex;flex-direction:column}
.post .img{aspect-ratio:21/9;overflow:hidden;position:relative}
.post .img img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02)}
.post .img .st{position:absolute;top:10px;left:10px;font-size:clamp(14px,1vw,17px);font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:oklch(0% 0 0 / .55);color:#fff}
.post .img .st.live{background:var(--green);color:#042}
.post .b{padding:10px 14px 12px;display:flex;flex-direction:column;gap:4px}
.post .g{font-size:clamp(18px,1.25vw,23px);font-weight:700;color:#fff;line-height:1.2}
.post .m{font-size:clamp(16px,1.1vw,19px);color:var(--ink3)}
.post .t{font-size:clamp(16px,1.05vw,19px);color:var(--ink2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1100px){.pillars,.bigsets{grid-template-columns:repeat(2,1fr)}.posts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.pillars,.bigsets,.posts{grid-template-columns:1fr}}

#s2 h2{font-size:clamp(28px,2.6vw,48px);margin-bottom:clamp(12px,1.4vw,22px);max-width:none}#s2 ul.big{gap:clamp(10px,1.1vw,18px)}#s2 ul.big li{font-size:clamp(21px,1.6vw,29px)}#s5 h2{font-size:clamp(28px,2.6vw,48px);margin-bottom:12px}#s5 .note{margin-top:10px}
#s11 h2,#s12 h2,#s14 h2,#s8 h2,#s8b h2,#s7 h2,#s7b h2,#s11b h2,#s13 h2,#s10 h2,#s6 h2{font-size:clamp(28px,2.5vw,46px);margin-bottom:clamp(12px,1.4vw,22px);max-width:none}
#s7b .pillar{gap:9px;padding:clamp(16px,1.6vw,24px)}#s7b .pillar .what{font-size:clamp(19px,1.35vw,24px)}#s7b .pillar .why,#s7b .pillar .res{font-size:clamp(17px,1.2vw,21px)}#s10 h2,#s11 h2{margin-bottom:10px}#s10 .note,#s11 .note{margin-top:10px;font-size:clamp(17px,1.15vw,21px)}#s11 .xdense td{padding:clamp(6px,.6vw,10px) 12px}#s10 .xdense td,#s10 .dense td{padding:clamp(7px,.65vw,11px) 12px}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
@media print{html{scroll-snap-type:none}section.slide{min-height:auto;height:100vh;page-break-after:always;break-after:page}.reveal{opacity:1;transform:none}body{background:#0b0d14}}

/* daily tabs */
.tabbar{position:sticky;top:0;z-index:5;background:oklch(13% 0.02 260 / .92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px clamp(22px,5.5vw,100px);display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabbar::-webkit-scrollbar{display:none}
.tabbar a{flex:0 0 auto;text-decoration:none;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:clamp(17px,1.2vw,22px);font-weight:700;letter-spacing:.02em;white-space:nowrap;background:oklch(100% 0 0 / .04)}
.tabbar a small{display:block;font-weight:600;font-size:.72em;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.tabbar a.on{background:var(--gold);color:oklch(20% 0.05 240);border-color:var(--gold)}
.tabbar a.on small{color:oklch(30% 0.05 240)}
.daygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.4vw,24px)}
.daygrid .card .big{font-size:clamp(56px,6.5vw,124px)}
.daygrid .card.hi{border-color:oklch(87% 0.10 215 / .5);box-shadow:0 0 0 1px oklch(87% 0.10 215 / .25) inset}
.rate{display:flex;gap:clamp(18px,3vw,56px);flex-wrap:wrap;margin-top:clamp(14px,1.6vw,26px)}
.rate div{font-size:var(--fs-m);color:var(--ink)}
.rate span{display:block;font-size:var(--fs-s);color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:4px}
section.slide{scroll-margin-top:84px}
@media (max-width:900px){.card .tbl table,.tbl table{min-width:0!important;font-size:14px;width:100%}.card td,.card th{padding:8px 3px!important;white-space:nowrap!important}.card th{font-size:11px!important;letter-spacing:.04em}.card td:first-child{font-weight:700}.rate{gap:14px 22px}.rate div{font-size:20px}.daygrid{grid-template-columns:repeat(2,1fr)}.daygrid .card .big{font-size:clamp(44px,12vw,72px)}.card{padding:16px}.tabbar{padding:10px 16px}}

#plan.ap{--apb:#164cca;--apbb:#edf3ff;--apg:#06724f;--apgb:#e8f7f0;--apa:#98420a;--apab:#fff2dd;--apl:#d9e2ed;--apm:#53657b;--apbg:#eef3f9;font-family:"Public Sans",Inter,Arial,sans-serif;font-variant-numeric:tabular-nums}
#plan .lede{color:var(--apm);margin:0 0 8px}
#plan .legend{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 18px;font-weight:700;font-size:15px}#plan .legend span{padding:8px 14px;border-radius:8px}#plan .legend .daily{background:var(--apbb);color:var(--apb)}#plan .legend .total{background:var(--apgb);color:var(--apg)}#plan .legend .cost{background:#fff;color:var(--apm);border:1px solid var(--apl)}
#plan .table-wrap{overflow-x:auto;border:1px solid var(--apl);border-radius:12px;background:#fff}
#plan table{width:100%;min-width:2300px;border-collapse:collapse;table-layout:fixed;color:#12263f}
#plan th,#plan td{padding:12px 8px;border-right:1px solid var(--apl);border-bottom:1px solid var(--apl);text-align:center;font-size:16px}
#plan th:first-child,#plan td:first-child{width:190px;text-align:left;padding-left:16px;background:#fff;position:sticky;left:0;z-index:2}
